version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - python -m pip install -r docs/requirements.txt
    - python -m pip install .
    - python -m sphinx.apidoc -o docs/api ScintSuite -f

python:
  install:
    - method: pip
      path: .
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
  builder: html
