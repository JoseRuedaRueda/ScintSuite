version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - python -m pip install --upgrade pip setuptools wheel
    - python -m pip install sphinx sphinx-rtd-theme sphinx-autodoc-typehints sphinxcontrib-napoleon
    - python -m pip install -r docs/requirements.txt || true
    - python -m pip install .
    - python -m sphinx.ext.apidoc -o docs/api ScintSuite -f

python:
  install:
    - method: pip
      path: .
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
  builder: html
